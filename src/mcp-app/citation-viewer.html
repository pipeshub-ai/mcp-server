<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PipesHub citations</title>
<style>
  /*
   * PipesHub's look: Radix Themes, olive greys, jade/emerald accent, medium
   * radius (3px chips, 4px controls, 6px cards). Borderless: surfaces part
   * by fill and elevation. Shadows fall downward in two layers, a tight
   * contact shadow for the edge and a wide faint one for lift, tinted with
   * the palette's green-grey; on dark, where shadows barely read, a raised
   * surface is lighter and catches a 1px top highlight.
   */
  :root {
    color-scheme: light dark;
    --r-1: 3px; --r-2: 4px; --r-3: 6px;
    --canvas: #f5f7f6;
    --bg: #ffffff;
    --surface: #f5f7f6;
    --surface-2: #eaeeec;
    --fg: #111113;
    --muted: #687076;
    --line: rgba(22, 33, 27, 0.07);
    --accent: #0c9d6c;
    --accent-soft: rgba(16, 185, 129, 0.10);
    --accent-ring: rgba(16, 185, 129, 0.40);
    --mark: rgba(61, 217, 160, 0.30);
    --mark-edge: #10b981;
    --e-1: 0 1px 2px rgba(22, 33, 27, 0.06), 0 3px 10px -4px rgba(22, 33, 27, 0.10);
    --e-2: 0 2px 4px rgba(22, 33, 27, 0.06), 0 12px 28px -10px rgba(22, 33, 27, 0.20);
    --e-bar: 0 1px 3px rgba(22, 33, 27, 0.06);
    --e-page: 0 1px 3px rgba(22, 33, 27, 0.08), 0 16px 40px -12px rgba(22, 33, 27, 0.22);
    --font: Manrope, var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif);
  }
  [data-theme="dark"] {
    --canvas: #111113;
    --bg: #18191b;
    --surface: #111113;
    --surface-2: #232527;
    --fg: #edeeef;
    --muted: #9ba1a6;
    --line: rgba(255, 255, 255, 0.06);
    --accent: #3dd9a0;
    --accent-soft: rgba(61, 217, 160, 0.12);
    --accent-ring: rgba(61, 217, 160, 0.45);
    --mark: rgba(61, 217, 160, 0.26);
    --mark-edge: #3dd9a0;
    --e-1: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 1px 2px rgba(0, 0, 0, 0.45), 0 4px 12px -4px rgba(0, 0, 0, 0.5);
    --e-2: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 2px 4px rgba(0, 0, 0, 0.5), 0 14px 30px -10px rgba(0, 0, 0, 0.65);
    --e-bar: 0 1px 0 rgba(0, 0, 0, 0.5), 0 4px 12px -6px rgba(0, 0, 0, 0.6);
    --e-page: 0 2px 6px rgba(0, 0, 0, 0.5), 0 20px 44px -12px rgba(0, 0, 0, 0.7);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--canvas); color: var(--fg); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; }
  button:focus-visible { outline: 2px solid var(--accent-ring); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* Shared pieces */
  .logo { width: 18px; height: 18px; flex: none; }
  .num { flex: none; display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px;
    border-radius: var(--r-1); background: var(--accent-soft); color: var(--accent);
    font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .file { flex: none; display: inline-grid; place-items: center; width: 30px; height: 18px; border-radius: var(--r-1);
    font-size: 9.5px; font-weight: 800; letter-spacing: .04em; color: #fff; background: #6b7280; }
  .file.pdf { background: #e5484d; } .file.sheet { background: #1f9d55; } .file.doc { background: #3e63dd; }
  .file.web { background: #8e4ec6; } .file.text { background: #6b7280; }
  .chip { flex: none; font-size: 11.5px; color: var(--muted); background: var(--surface-2); border-radius: var(--r-1); padding: 1px 7px; white-space: nowrap; }
  .status { color: var(--muted); font-size: 13px; }
  #pages > .status { padding: 4px 4px 14px; }
  .error { color: #e5484d; }

  /* Download loader: a progress bar, sweeping until the file's size is known. */
  .loader { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 60%; padding: 48px 16px; }
  .loader-bar { width: 220px; height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
  .loader-fill { height: 100%; width: 0; border-radius: 2px; background: var(--accent); transition: width .25s ease; }
  .loader-bar:not(.known) .loader-fill { width: 35%; animation: sweep 1.2s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
  .loader-note { color: var(--muted); font-size: 12.5px; }
  @media (prefers-reduced-motion: reduce) { .loader-bar .loader-fill { animation: none; } }

  /* Citations card */
  #card { padding: 14px; }
  .card-head { display: flex; align-items: center; gap: 8px; margin: 0 2px 12px; }
  .card-head h1 { margin: 0; font-size: 14.5px; font-weight: 700; letter-spacing: -.01em; }
  .card-head .count { margin-left: auto; color: var(--muted); font-size: 12px; }
  #citations { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; padding: 11px 12px;
    background: var(--bg); border-radius: var(--r-3); box-shadow: var(--e-1);
    transition: box-shadow .18s ease, transform .18s ease; }
  .row:hover { box-shadow: var(--e-2); transform: translateY(-1px); }
  .row:active { transform: translateY(0); box-shadow: var(--e-1); }
  .row .body { flex: 1; min-width: 0; }
  .row .top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; min-width: 0; }
  .row .name { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .quote { color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .go { flex: none; align-self: center; color: var(--muted); opacity: 0; transition: opacity .18s, transform .18s; }
  .row:hover .go { opacity: 1; transform: translateX(2px); color: var(--accent); }

  /* Record preview */
  #preview { display: flex; flex-direction: column; height: 100vh; background: var(--canvas); }
  #preview.inline { height: 640px; }
  .bar { position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--bg); box-shadow: var(--e-bar); }
  .bar .title { min-width: 0; font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .spacer { flex: 1; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: var(--r-2);
    background: var(--surface-2); font-size: 12.5px; font-weight: 600; transition: background .15s, color .15s; }
  .btn:hover { background: var(--accent-soft); color: var(--accent); }
  .btn.icon { width: 30px; padding: 0; justify-content: center; }
  .btn.ghost { background: transparent; }
  .btn.ghost:hover { background: var(--surface-2); color: var(--fg); }
  .zoom { display: inline-flex; align-items: center; height: 30px; border-radius: var(--r-2); background: var(--surface-2); overflow: hidden; }
  .zoom button { height: 100%; min-width: 30px; padding: 0 8px; background: transparent; font-size: 14px; font-weight: 600; }
  .zoom button:hover { background: var(--accent-soft); color: var(--accent); }
  .zoom #z-fit { font-size: 12px; box-shadow: inset 1px 0 0 var(--line); }
  #z-level { min-width: 46px; text-align: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .split { flex: 1; display: flex; min-height: 0; }
  #pages { flex: 1; overflow: auto; background: var(--canvas); padding: 22px; }
  .page { position: relative; margin: 0 auto 22px; background: #fff; border-radius: var(--r-1); box-shadow: var(--e-page); overflow: hidden; }
  .page canvas { display: block; width: 100%; height: 100%; }
  .hl { position: absolute; background: var(--mark); border-radius: var(--r-1); box-shadow: inset 3px 0 0 var(--mark-edge); pointer-events: none; mix-blend-mode: multiply; }
  .hl.flash { animation: flash 1.4s ease-out; }
  @keyframes flash { 0% { box-shadow: inset 3px 0 0 var(--mark-edge), 0 0 0 8px var(--accent-ring); } 100% { box-shadow: inset 3px 0 0 var(--mark-edge), 0 0 0 0 transparent; } }
  .sheet-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .sheet-tab { height: 28px; padding: 0 12px; background: var(--bg); border-radius: var(--r-2); font-size: 12px; font-weight: 600; box-shadow: var(--e-1); }
  .sheet-tab.active { background: var(--accent-soft); color: var(--accent); box-shadow: none; }
  .sheet-wrap { display: inline-block; min-width: 100%; background: var(--bg); border-radius: var(--r-3); box-shadow: var(--e-1); overflow: hidden; }
  table.sheet { border-collapse: separate; border-spacing: 0; font-size: 12.5px; white-space: nowrap; }
  .sheet th, .sheet td { padding: 6px 10px; text-align: left; box-shadow: inset -1px -1px 0 var(--line); }
  .sheet th { position: sticky; top: -22px; background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: 11.5px; z-index: 1; }
  .sheet .rn { color: var(--muted); background: var(--surface); text-align: right; font-variant-numeric: tabular-nums; }
  .sheet tr.gap td { text-align: center; color: var(--muted); background: var(--surface); }
  .sheet tr.hl-row td { background: var(--mark); }
  .sheet tr.hl-row td:first-child { box-shadow: inset 3px 0 0 var(--mark-edge), inset -1px -1px 0 var(--line); }
  .sheet tr.hl-row.flash td { animation: rowflash 1.4s ease-out; }
  @keyframes rowflash { 0% { background: var(--accent-ring); } 100% { background: var(--mark); } }
  .docx-page .docx-wrapper { background: transparent; padding: 0; }
  .docx-page section.docx { box-shadow: var(--e-page); border-radius: var(--r-1); margin: 0 auto 22px; max-width: 100%; }
  .docx-page .hl-block { background: var(--mark) !important; box-shadow: inset 3px 0 0 var(--mark-edge); border-radius: var(--r-1); }
  .docx-page .hl-block.flash { animation: flash 1.4s ease-out; }
  .text-doc { max-width: 760px; margin: 0 auto; background: var(--bg); border-radius: var(--r-3); padding: 22px 26px; white-space: pre-wrap; box-shadow: var(--e-1); line-height: 1.65; }
  .text-doc mark { background: var(--mark); color: inherit; border-radius: var(--r-1); padding: 0 2px; }
  #side { width: 320px; flex: none; overflow: auto; padding: 16px 14px; background: var(--canvas); }
  .side-head { display: flex; align-items: center; gap: 8px; margin: 2px 2px 12px; font-size: 13px; font-weight: 700; }
  .side-head .count { margin-left: auto; color: var(--muted); font-weight: 500; font-size: 12px; }
  .cite { padding: 12px; margin-bottom: 10px; border-radius: var(--r-3); background: var(--bg); box-shadow: var(--e-1); cursor: pointer; transition: box-shadow .18s, background .18s; }
  .cite:hover { box-shadow: var(--e-2); }
  .cite.active { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .cite .label { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .cite .label .chips { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
  .cite .quote { font-size: 13px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  .cite.open .quote { -webkit-line-clamp: unset; }
  .more { background: none; padding: 6px 0 0; color: var(--accent); font-size: 12px; font-weight: 600; }
  @media (max-width: 640px) { #side { display: none; } }
</style>
</head>
<body>
  <div id="card">
    <div class="card-head">
      <svg class="logo" viewBox="0 0 80 80" aria-hidden="true"><g fill="#70CDA7"><path d="M57.3 11.7v11.8H69V11.7zM57.3 58.7v11.8H69V58.7zM11.6 11.7v11.8h11.8V11.7zM11.6 58.7v11.8h11.8V58.7zM17.8 40.7l-8.9-8.9L0 40.7l8.9 8.9zM40.5 62.1l8.9 8.9-8.9 8.9-8.9-8.9zM71.1 31.7l8.9 9-8.9 8.9-8.9-8.9zM40.5 0l8.9 8.9-8.9 9-8.9-9zM40 31.8l8.9 8.9-8.9 8.9-8.9-8.9z"/></g></svg>
      <h1>Citations</h1>
      <span class="count" id="c-count"></span>
    </div>
    <div id="status" class="status">Loading citations…</div>
    <div id="citations"></div>
  </div>
  <div id="preview" class="hidden">
    <div class="bar">
      <button class="btn ghost icon" id="p-close" aria-label="Back to citations" title="Back to citations">←</button>
      <span id="p-file"></span>
      <span class="title" id="p-title"></span>
      <span class="spacer"></span>
      <span class="zoom" id="zoom">
        <button id="z-out" aria-label="Zoom out" title="Zoom out">−</button>
        <span id="z-level">100%</span>
        <button id="z-in" aria-label="Zoom in" title="Zoom in">+</button>
        <button id="z-fit" title="Fit to width">Fit</button>
      </span>
      <button class="btn" id="p-open">Open ↗</button>
    </div>
    <div class="split">
      <div id="pages"></div>
      <div id="side">
        <div class="side-head">
          <svg class="logo" viewBox="0 0 80 80" aria-hidden="true"><g fill="#70CDA7"><path d="M57.3 11.7v11.8H69V11.7zM57.3 58.7v11.8H69V58.7zM11.6 11.7v11.8h11.8V11.7zM11.6 58.7v11.8h11.8V58.7zM17.8 40.7l-8.9-8.9L0 40.7l8.9 8.9zM40.5 62.1l8.9 8.9-8.9 8.9-8.9-8.9zM71.1 31.7l8.9 9-8.9 8.9-8.9-8.9zM40.5 0l8.9 8.9-8.9 9-8.9-9zM40 31.8l8.9 8.9-8.9 8.9-8.9-8.9z"/></g></svg>
          Citations in this document<span class="count" id="p-count"></span>
        </div>
        <div id="p-cites"></div>
      </div>
    </div>
  </div>
  <script type="module">/*VIEW_SCRIPT*/</script>
</body>
</html>
