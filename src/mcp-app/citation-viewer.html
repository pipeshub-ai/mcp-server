<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PipesHub citations</title>
<style>
  /* PipesHub's palette: emerald accent on olive-slate greys. */
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --surface: #f6f8f7;
    --surface-2: #eceff0;
    --fg: #111113;
    --muted: #687076;
    --border: rgba(17, 17, 19, 0.09);
    --accent: #0c9d6c;
    --accent-soft: rgba(16, 185, 129, 0.10);
    --accent-ring: rgba(16, 185, 129, 0.40);
    --mark: rgba(61, 217, 160, 0.30);
    --mark-edge: #10b981;
    --shadow: 0 1px 2px rgba(16, 24, 20, 0.06), 0 4px 16px rgba(16, 24, 20, 0.06);
    --page-shadow: 0 2px 8px rgba(0, 0, 0, 0.12), 0 12px 32px rgba(0, 0, 0, 0.08);
    --font: Manrope, var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif);
  }
  [data-theme="dark"] {
    --bg: #111113;
    --surface: #18191b;
    --surface-2: #212225;
    --fg: #edeeef;
    --muted: #9ba1a6;
    --border: rgba(255, 255, 255, 0.08);
    --accent: #3dd9a0;
    --accent-soft: rgba(61, 217, 160, 0.12);
    --accent-ring: rgba(61, 217, 160, 0.45);
    --mark: rgba(61, 217, 160, 0.26);
    --mark-edge: #3dd9a0;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 20px rgba(0, 0, 0, 0.25);
    --page-shadow: 0 2px 10px rgba(0, 0, 0, 0.5), 0 16px 40px rgba(0, 0, 0, 0.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent-ring); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* Shared pieces */
  .logo { width: 18px; height: 18px; flex: none; }
  .num { flex: none; display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px;
    border-radius: 11px; background: var(--accent-soft); color: var(--accent); font-size: 11.5px; font-weight: 700; }
  .file { flex: none; display: inline-grid; place-items: center; width: 30px; height: 20px; border-radius: 5px;
    font-size: 9.5px; font-weight: 800; letter-spacing: .04em; color: #fff; background: #6b7280; }
  .file.pdf { background: #e5484d; } .file.sheet { background: #1f9d55; } .file.doc { background: #3e63dd; }
  .file.web { background: #8e4ec6; } .file.text { background: #6b7280; }
  .chip { flex: none; font-size: 11.5px; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
  .status { color: var(--muted); font-size: 13px; }
  #pages > .status { padding: 4px 4px 14px; }
  .error { color: #e5484d; }

  /* Citations card */
  #card { padding: 14px; }
  .card-head { display: flex; align-items: center; gap: 8px; margin: 0 2px 12px; }
  .card-head h1 { margin: 0; font-size: 14.5px; font-weight: 700; letter-spacing: -.01em; }
  .card-head .count { margin-left: auto; color: var(--muted); font-size: 12px; }
  #citations { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; padding: 11px 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    transition: border-color .15s, background .15s, transform .15s, box-shadow .15s; }
  .row:hover { border-color: var(--accent-ring); background: var(--bg); box-shadow: var(--shadow); transform: translateY(-1px); }
  .row .body { flex: 1; min-width: 0; }
  .row .top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; min-width: 0; }
  .row .name { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .quote { color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .go { flex: none; align-self: center; color: var(--muted); opacity: 0; transition: opacity .15s, transform .15s; }
  .row:hover .go { opacity: 1; transform: translateX(2px); color: var(--accent); }

  /* Record preview */
  #preview { display: flex; flex-direction: column; height: 100vh; background: var(--bg); }
  #preview.inline { height: 640px; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .bar .title { min-width: 0; font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .spacer { flex: 1; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface); font-size: 12.5px; font-weight: 600; transition: border-color .15s, background .15s; }
  .btn:hover { border-color: var(--accent-ring); background: var(--accent-soft); color: var(--accent); }
  .btn.icon { width: 30px; padding: 0; justify-content: center; }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: var(--surface-2); color: var(--fg); border-color: transparent; }
  .zoom { display: inline-flex; align-items: center; height: 30px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); overflow: hidden; }
  .zoom button { height: 100%; min-width: 30px; padding: 0 8px; border: 0; background: transparent; font-size: 14px; font-weight: 600; }
  .zoom button:hover { background: var(--accent-soft); color: var(--accent); }
  .zoom #z-fit { font-size: 12px; border-left: 1px solid var(--border); }
  #z-level { min-width: 46px; text-align: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .split { flex: 1; display: flex; min-height: 0; }
  #pages { flex: 1; overflow: auto; background: var(--surface); padding: 20px; }
  .page { position: relative; margin: 0 auto 20px; background: #fff; border-radius: 4px; box-shadow: var(--page-shadow); overflow: hidden; }
  .page canvas { display: block; width: 100%; height: 100%; }
  .hl { position: absolute; background: var(--mark); border-radius: 3px; box-shadow: inset 3px 0 0 var(--mark-edge); pointer-events: none; mix-blend-mode: multiply; }
  [data-theme="dark"] .hl { mix-blend-mode: normal; }
  .hl.flash { animation: flash 1.4s ease-out; }
  @keyframes flash { 0% { box-shadow: inset 3px 0 0 var(--mark-edge), 0 0 0 8px var(--accent-ring); } 100% { box-shadow: inset 3px 0 0 var(--mark-edge), 0 0 0 0 transparent; } }
  .sheet-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .sheet-tab { height: 28px; padding: 0 12px; border: 1px solid var(--border); background: var(--bg); border-radius: 999px; font-size: 12px; font-weight: 600; }
  .sheet-tab.active { background: var(--accent-soft); border-color: var(--accent-ring); color: var(--accent); }
  .sheet-wrap { display: inline-block; min-width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
  table.sheet { border-collapse: separate; border-spacing: 0; font-size: 12.5px; white-space: nowrap; }
  .sheet th, .sheet td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); padding: 5px 10px; text-align: left; }
  .sheet th { position: sticky; top: -20px; background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: 11.5px; z-index: 1; }
  .sheet .rn { color: var(--muted); background: var(--surface); text-align: right; font-variant-numeric: tabular-nums; }
  .sheet tr.hl-row td { background: var(--mark); }
  .sheet tr.hl-row td:first-child { box-shadow: inset 3px 0 0 var(--mark-edge); }
  .sheet tr.hl-row.flash td { animation: rowflash 1.4s ease-out; }
  @keyframes rowflash { 0% { background: var(--accent-ring); } 100% { background: var(--mark); } }
  .docx-page .docx-wrapper { background: transparent; padding: 0; }
  .docx-page section.docx { box-shadow: var(--page-shadow); border-radius: 4px; margin: 0 auto 20px; max-width: 100%; }
  .docx-page .hl-block { background: var(--mark) !important; box-shadow: inset 3px 0 0 var(--mark-edge); border-radius: 3px; }
  .docx-page .hl-block.flash { animation: flash 1.4s ease-out; }
  .text-doc { max-width: 760px; margin: 0 auto; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 22px 26px; white-space: pre-wrap; box-shadow: var(--shadow); line-height: 1.65; }
  .text-doc mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
  #side { width: 320px; flex: none; border-left: 1px solid var(--border); overflow: auto; padding: 14px; background: var(--bg); }
  .side-head { display: flex; align-items: center; gap: 8px; margin: 2px 2px 12px; font-size: 13px; font-weight: 700; }
  .side-head .count { margin-left: auto; color: var(--muted); font-weight: 500; font-size: 12px; }
  .cite { padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); cursor: pointer; transition: border-color .15s, background .15s; }
  .cite:hover { border-color: var(--accent-ring); }
  .cite.active { border-color: var(--accent); background: var(--accent-soft); }
  .cite .label { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .cite .label .chips { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
  .cite .quote { font-size: 13px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  .cite.open .quote { -webkit-line-clamp: unset; }
  .more { background: none; border: 0; padding: 6px 0 0; color: var(--accent); font-size: 12px; font-weight: 600; }
  @media (max-width: 640px) { #side { display: none; } }
</style>
</head>
<body>
  <div id="card">
    <div class="card-head">
      <svg class="logo" viewBox="0 0 80 80" aria-hidden="true"><g fill="#70CDA7"><path d="M57.3 11.7v11.8H69V11.7zM57.3 58.7v11.8H69V58.7zM11.6 11.7v11.8h11.8V11.7zM11.6 58.7v11.8h11.8V58.7zM17.8 40.7l-8.9-8.9L0 40.7l8.9 8.9zM40.5 62.1l8.9 8.9-8.9 8.9-8.9-8.9zM71.1 31.7l8.9 9-8.9 8.9-8.9-8.9zM40.5 0l8.9 8.9-8.9 9-8.9-9zM40 31.8l8.9 8.9-8.9 8.9-8.9-8.9z"/></g></svg>
      <h1>Citations</h1>
      <span class="count" id="c-count"></span>
    </div>
    <div id="status" class="status">Loading citations…</div>
    <div id="citations"></div>
  </div>
  <div id="preview" class="hidden">
    <div class="bar">
      <button class="btn ghost icon" id="p-close" aria-label="Back to citations" title="Back to citations">←</button>
      <span id="p-file"></span>
      <span class="title" id="p-title"></span>
      <span class="spacer"></span>
      <span class="zoom" id="zoom">
        <button id="z-out" aria-label="Zoom out" title="Zoom out">−</button>
        <span id="z-level">100%</span>
        <button id="z-in" aria-label="Zoom in" title="Zoom in">+</button>
        <button id="z-fit" title="Fit to width">Fit</button>
      </span>
      <button class="btn" id="p-open">Open ↗</button>
    </div>
    <div class="split">
      <div id="pages"></div>
      <div id="side">
        <div class="side-head">
          <svg class="logo" viewBox="0 0 80 80" aria-hidden="true"><g fill="#70CDA7"><path d="M57.3 11.7v11.8H69V11.7zM57.3 58.7v11.8H69V58.7zM11.6 11.7v11.8h11.8V11.7zM11.6 58.7v11.8h11.8V58.7zM17.8 40.7l-8.9-8.9L0 40.7l8.9 8.9zM40.5 62.1l8.9 8.9-8.9 8.9-8.9-8.9zM71.1 31.7l8.9 9-8.9 8.9-8.9-8.9zM40.5 0l8.9 8.9-8.9 9-8.9-9zM40 31.8l8.9 8.9-8.9 8.9-8.9-8.9z"/></g></svg>
          Citations in this document<span class="count" id="p-count"></span>
        </div>
        <div id="p-cites"></div>
      </div>
    </div>
  </div>
  <script type="module">/*VIEW_SCRIPT*/</script>
</body>
</html>
